name: Coleta ATLAS

on:
  schedule:
    # O GitHub pode atrasar horários agendados em várias horas; por isso há três tentativas.
    # Se nada mudou, a execução não grava nada.
    # 06h17 em Brasília, de segunda a sábado (pregão anterior)
    - cron: "17 9 * * 1-6"
    # 12h47 em Brasília, de segunda a sábado (repescagem se a de cedo atrasou ou falhou)
    - cron: "47 15 * * 1-6"
    # 21h37 em Brasília, de segunda a sexta (tenta pegar o pregão do próprio dia)
    - cron: "37 0 * * 2-6"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Baixar os balanços da CVM de novo, mesmo com cache recente"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: coleta-atlas
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conferir cálculos (teste offline)
        run: python testes/teste_coletor.py

      - name: Coletar dados oficiais
        run: |
          if [ "${{ inputs.forcar }}" = "true" ]; then
            python coletor/main.py --forcar
          else
            python coletor/main.py
          fi

      - name: Salvar resultado no repositório
        if: always()
        run: |
          git config user.name "atlas-coletor"
          git config user.email "atlas-coletor@users.noreply.github.com"
          git add docs/data data || true
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Coleta $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git push
          fi

      - name: Avisar se a coleta falhou ou se uma fonte essencial está atrasada
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FALHOU: ${{ job.status != 'success' }}
        run: |
          MSG=""
          if [ "$FALHOU" = "true" ]; then MSG="A coleta automática falhou. Veja o registro: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; fi
          if [ -f data/alerta.txt ]; then MSG="$MSG
          Fontes essenciais com problema:
          $(cat data/alerta.txt)"; fi
          if [ -z "$MSG" ]; then echo "Sem alertas."; exit 0; fi
          ABERTO=$(gh issue list --state open --search "Alerta da coleta ATLAS in:title" --json number --jq '.[0].number')
          if [ -n "$ABERTO" ]; then gh issue comment "$ABERTO" --body "$MSG"; else gh issue create --title "Alerta da coleta ATLAS" --body "$MSG"; fi
